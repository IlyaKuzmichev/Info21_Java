version: '3.8'

services:
  postgres:
    image: 'postgres:latest'
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init-script.sql
      - ./shared:/shared
    ports:
      - "5432:5432"

  liquibase:
    image: liquibase/liquibase
    depends_on:
      - postgres
    environment:
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD}
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      LIQUIBASE_COMMAND_DRIVER: org.postgresql.Driver
      LIQUIBASE_SEARCH_PATH: /liquibase/changelog
      LIQUIBASE_LIQUIBASE_SCHEMA_NAME: liquibase
      LIQUIBASE_COMMAND_DEFAULT_SCHEMA_NAME: app
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.yaml
    volumes:
      - ./src/main/resources/migrations:/liquibase/changelog
    command:
      - update
  app:
    image: 'openjdk:21-jdk'
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SHARED_PATH: ${SHARED_PATH}
    volumes:
      - ./shared:/shared  # Прокидываем каталог для импорта
      - ./build/libs/Info21-0.0.1-SNAPSHOT.jar:/app.jar  # Копируем JAR в контейнер
    command: [ "java", "-jar", "app.jar" ]  # Запуск приложения
    ports:
      - "8080:8080"
volumes:
  shared:
  postgres_data:
