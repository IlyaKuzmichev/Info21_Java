peers:
  - name: "TransferredPoints"
    query: "SELECT * FROM get_transferred_points_summary();"
    description: |
      Функция, возвращающая таблицу TransferredPoints в более человекочитаемом виде
      Ник пира 1, ник пира 2, количество переданных пир поинтов.
      Количество отрицательное, если пир 2 получил от пира 1 больше поинтов.
  - name: "Пиры успешно завершившие задания"
    query: "SELECT * FROM get_peer_xp_info();"
    description: |
      Функция, которая возвращает таблицу вида: ник пользователя, название проверенного задания, кол-во полученного XP
      В таблицу включать только задания, успешно прошедшие проверку (определять по таблице Checks).
      Одна задача может быть успешно выполнена несколько раз. В таком случае в таблицу включать все успешные проверки.
  - name: "Пиры не выходили из капуса"
    query: "SELECT * FROM get_whole_day_peers('2023-09-24');"
    description: |
      Функция, определяющая пиров, которые не выходили из кампуса в течение всего дня
      Параметры функции: день, например 2023-09-24.
      Функция возвращает только список пиров.
  - name: "Динамика экспы пиров"
    query: "SELECT * FROM calculate_peer_points_change();"
    description: |
      Посчитать изменение в количестве пир поинтов каждого пира по таблице TransferredPoints
      Результат вывести отсортированным по изменению числа поинтов.
      Формат вывода: ник пира, изменение в количество пир поинтов
  - name: "Динамика экспы пиров (2)"
    query: "SELECT * FROM fast_calculate_peer_points_change();"
    description: |
      Посчитать изменение в количестве пир поинтов каждого пира по таблице, возвращаемой первой функцией из Part 3 (get_transferred_points_summary)
      Результат вывести отсортированным по изменению числа поинтов.
      Формат вывода: ник пира, изменение в количество пир поинтов
  - name: "Показать пиров завершивших блокировку"
    query: "SELECT * FROM get_peers_completed_whole_block('A');"
    description: |
      Найти всех пиров, выполнивших весь заданный блок задач и дату завершения последнего задания
      Параметры процедуры: название блока, например "CPP".
      Результат вывести отсортированным по дате завершения.
      Формат вывода: ник пира, дата завершения блока (т.е. последнего выполненного задания из этого блока)
  - name: "Показать опытного пира"
    query: "SELECT * FROM get_recommended_checkers();"
    description: |
      Определить, к какому пиру стоит идти на проверку каждому обучающемуся
      Определять нужно исходя из рекомендаций друзей пира, т.е. нужно найти пира, проверяться у которого рекомендует наибольшее число друзей.
      Формат вывода: ник пира, ник найденного проверяющего
  - name: "Пиры работающие над блоками проектов"
    query: "SELECT * FROM calculate_block_participation('A', 'DO');"
    description: |
      Определить процент пиров, которые:
      Приступили только к блоку 1
      Приступили только к блоку 2
      Приступили к обоим
      Не приступили ни к одному
  
      Пир считается приступившим к блоку, если он проходил хоть одну проверку любого задания из этого блока (по таблице Checks)
      Параметры процедуры: название блока 1, например SQL, название блока 2, например A.
      Формат вывода: процент приступивших только к первому блоку, процент приступивших только ко второму блоку, процент приступивших к обоим, процент не приступивших ни к одному

  - name: "Пиры прошедшие проверку в день рождения"
    query: "SELECT * FROM calculate_birthday_check_percent();"
    description: |
      Определить процент пиров, которые когда-либо успешно проходили проверку в свой день рождения
      Также определите процент пиров, которые хоть раз проваливали проверку в свой день рождения.
      Формат вывода: процент пиров, успешно прошедших проверку в день рождения, процент пиров, проваливших проверку в день рождения

  - name: "Пиры сдали X,Y но не Z"
    query: "SELECT * FROM find_peers_not_completed_task('A1_Maze', 'A2_SimpleNavigator_v1.0', 'DO6_CICD');"
    description: |
      Определить всех пиров, которые сдали заданные задания 1 и 2, но не сдали задание 3
      Параметры процедуры: названия заданий 1, 2 и 3.
      Формат вывода: список пиров
  - name: "Пиры с максимальным количеством ХР"
    query: "SELECT * FROM get_peer_with_maximum_xp();"
    description: |
      Определить пира с наибольшим количеством XP
      Формат вывода: ник пира, количество XP
  - name: "Пиры приходили раньше времени"
    query: "SELECT * FROM get_early_bird_peers('12:00:00', 1);"
    description: |
      Определить пиров, приходивших раньше заданного времени не менее N раз за всё время
      Параметры процедуры: время, количество раз N.
      Формат вывода: список пиров

  - name: "Пиры выходили из кампуса"
    query: "SELECT * FROM peers_lefts_last_days(40, 1);"
    description: |
      Определить пиров, выходивших за последние N дней из кампуса больше M раз
      Параметры процедуры: количество дней N, количество раз M.
      Формат вывода: список пиров

  - name: "Показать процент ранних входов"
    query: "SELECT * FROM early_entries_by_month_of_birth();"
    description: |
      Определить для каждого месяца процент ранних входов
      Для каждого месяца посчитать, сколько раз люди, родившиеся в этот месяц, приходили в кампус за всё время (будем называть это общим числом входов).
      Для каждого месяца посчитать, сколько раз люди, родившиеся в этот месяц, приходили в кампус раньше 12:00 за всё время (будем называть это числом ранних входов).
      Для каждого месяца посчитать процент ранних входов в кампус относительно общего числа входов.
      Формат вывода: месяц, процент ранних входов

checks:
  - name: "Добавление P2P проверки"
    query: "CALL add_p2p_check('Baboba', 'Derevo', 'DO3_LinuxMonitoring_v1.0', 'Start', '13:00');"
    description: |
      Параметры: ник проверяемого, ник проверяющего, название задания, статус P2P проверки, время.
      Если задан статус 'начало', добавить запись в таблицу Checks (в качестве даты использовать сегодняшнюю).
      Добавить запись в таблицу P2P.
      Если задан статус 'начало', в качестве проверки указать только что добавленную запись, 
      иначе указать проверку с незавершенным P2P этапом.
  - name: "Добавление проверки вертером"
    query: "CALL add_verter_check('Baboba', 'DO3_LinuxMonitoring_v1.0', 'Start', '13:15');"
    description: |
      Параметры: ник проверяемого, название задания, статус проверки Verter'ом, время.
      Добавить запись в таблицу Verter (в качестве проверки указать проверку соответствующего задания с самым поздним (по времени) успешным P2P этапом)
  - name: "Вывести все p2p проверки"
    query: "SELECT * FROM p2p;"
    description: |
      Каждая P2P проверка состоит из 2-х записей в таблице: первая имеет статус начало, вторая - успех или неуспех.
      В таблице не может быть больше одной незавершенной P2P проверки, относящейся к конкретному заданию, пиру и проверяющему.
      Каждая P2P проверка ссылается на проверку в таблице Checks, к которой она относится.
  - name: "Вывести удачные для проверок дни"
    query: "SELECT * FROM get_checks_lucky_days(2);"
    description: |
      Найти "удачные" для проверок дни. День считается "удачным", если в нем есть хотя бы N идущих подряд успешных проверки
      Параметры процедуры: количество идущих подряд успешных проверок N.
      Временем проверки считать время начала P2P этапа.
      Под идущими подряд успешными проверками подразумеваются успешные проверки, между которыми нет неуспешных.
      При этом кол-во опыта за каждую из этих проверок должно быть не меньше 80% от максимального.
      Формат вывода: список днейВывести дни, когда было больше двух успешных P2P проверок для конкретного задания

tasks:
  - name: "Вывести все таски"
    query: "SELECT * FROM tasks;"
    description: |
      Вывести все таски
  - name: "Самое проверямое задание в день"
    query: "SELECT * FROM get_popular_tasks_for_check();"
    description: |
      Определить самое часто проверяемое задание за каждый день
      При одинаковом количестве проверок каких-то заданий в определенный день, вывести их все.
      Формат вывода: день, название задания
  - name: "Вывести зависимые задачи"
    query: "SELECT * FROM get_task_hierarchy();"
    description: |
      Используя рекурсивное обобщенное табличное выражение, для каждой задачи вывести кол-во предшествующих ей задач
      То есть сколько задач нужно выполнить, исходя из условий входа, чтобы получить доступ к текущей.
      Формат вывода: название задачи, количество предшествующих