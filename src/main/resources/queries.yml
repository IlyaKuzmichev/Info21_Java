peers:
  - name: "TransferredPoints"
    query: "SELECT * FROM get_transferred_points_summary();"
    description: |
      Функция, возвращающая таблицу TransferredPoints в более человекочитаемом виде
      Ник пира 1, ник пира 2, количество переданных пир поинтов.
      Количество отрицательное, если пир 2 получил от пира 1 больше поинтов.

checks:
  - name: "Добавление P2P проверки"
    query: "CALL add_p2p_check('Baboba', 'Derevo', 'DO3_LinuxMonitoring_v1.0', 'Start', '13:00');"
    description: |
      Параметры: ник проверяемого, ник проверяющего, название задания, статус P2P проверки, время.
      Если задан статус 'начало', добавить запись в таблицу Checks (в качестве даты использовать сегодняшнюю).
      Добавить запись в таблицу P2P.
      Если задан статус 'начало', в качестве проверки указать только что добавленную запись, 
      иначе указать проверку с незавершенным P2P этапом.
  - name: "Вывести все p2p проверки"
    query: "SELECT * FROM p2p;"
    description: |
      Каждая P2P проверка состоит из 2-х записей в таблице: первая имеет статус начало, вторая - успех или неуспех.
      В таблице не может быть больше одной незавершенной P2P проверки, относящейся к конкретному заданию, пиру и проверяющему.
      Каждая P2P проверка ссылается на проверку в таблице Checks, к которой она относится.

tasks:
  - name: "Вывести все таски"
    query: "SELECT * FROM tasks;"
    description: |
      Вывести все таски