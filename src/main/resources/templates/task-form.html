<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Task Form</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <div th:replace="~{menu :: menu}"></div>
    <div th:replace="~{menu :: submenu}"></div>
    <main>
        <h2 th:text="${task.title == null ? 'Add New Task' : 'Edit Task'}"></h2>

        <form th:action="@{/tasks}" method="post" data-confirm="Вы уверены?">
            <input type="hidden" th:if="${task.title != null}" name="oldTitle" th:value="${task.title}" />
            <div>
                <label for="taskTitle">Task Title:</label>
                <input type="text" id="taskTitle" name="title" th:value="${task.title}" required />

                <label for="parentTask">Parent Project:</label>
                <select id="parentTask" name="parentTask" onchange="updateHiddenField()">
                    <option value="null" th:if="${task.parentTask == null}" selected>None</option>
                    <option th:each="project : ${projects}"
                            th:value="${project.title}"
                            th:text="${project.title}"
                            th:selected="${task.parentTask == project.title}">
                    </option>
                </select>

                <label for="maxXp">Max XP:</label>
                <input type="number" id="maxXp" name="maxXp" th:value="${task.maxXp}" required />
            </div>
            <button type="submit">Save</button>
            <a th:href="@{/tasks}">
                <button type="button">Cancel</button>
            </a>
        </form>
    </main>
</div>
</body>
<script type="text/javascript" src="/js/confirm_form.js"></script>
</html>
