<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Операции</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>

    </style>
</head>
<body>
<div class="container">
    <div th:replace="~{menu :: menu}"></div>
    <!-- Субменю как на странице пиров, но теперь работает как табы -->
    <header class="submenu">
        <nav>
            <ul>
                <li><a href="#" class="tab-link active" data-tab="peers">😺 Пиры</a></li>
                <li><a href="#" class="tab-link" data-tab="tasks">📋 Таски</a></li>
                <li><a href="#" class="tab-link" data-tab="checks">🔬 Проверки</a></li>
            </ul>
        </nav>
    </header>

    <main>
<!--        <h1>SQL Query Executor</h1>-->

        <!-- Контейнеры вкладок -->
        <div id="peers" class="tab-content active">
            <button onclick="insertQuery('SELECT * FROM peers;')">Вывести всех</button>
            <button onclick="insertQuery('INSERT INTO peers (nickname, birthday) VALUES (\'NewPeer\', \'2000-01-01\');')">Добавить пира</button>
            <button onclick="insertQuery('DELETE FROM peers WHERE nickname=\'OldPeer\';')">Удалить пира</button>
        </div>

        <div id="tasks" class="tab-content">
            <button onclick="insertQuery('SELECT * FROM tasks;')">Вывести все таски</button>
            <button onclick="insertQuery('UPDATE tasks SET max_xp=100 WHERE title=\'Task1\';')">Обновить XP таска</button>
            <button onclick="insertQuery('DELETE FROM tasks WHERE title=\'OldTask\';')">Удалить таск</button>
        </div>

        <div id="checks" class="tab-content">
            <button onclick="insertQuery('SELECT * FROM p2p;', 'Каждая P2P проверка состоит из 2-х записей в таблице: первая имеет статус начало, вторая - успех или неуспех.\n'+
'В таблице не может быть больше одной незавершенной P2P проверки, относящейся к конкретному заданию, пиру и проверяющему.\n'+
'Каждая P2P проверка (т.е. обе записи, из которых она состоит) ссылается на проверку в таблице Checks, к которой она относится.')">Вывести все p2p проверки</button>
            <button onclick="insertQuery('CALL add_p2p_check(\'Baboba\', \'Derevo\', \'DO3_LinuxMonitoring_v1.0\', \'Start\', \'13:00\');', 'Параметры: ник проверяемого, ник проверяющего, название задания, статус P2P проверки, время. Если статус \'начало\', добавляет запись в Checks и P2P. В противном случае связывает с существующей проверкой.')">Добавить проверку для пира</button>
            <button onclick="insertQuery('SELECT * FROM checks WHERE date > \'2023-01-01\';')">Проверки 2023</button>
            <button onclick="insertQuery('INSERT INTO checks (peer, task, status) VALUES (\'Aboba\', \'Task1\', \'passed\');')">Добавить проверку</button>
            <button onclick="insertQuery('DELETE FROM checks WHERE peer=\'Aboba\';')">Удалить проверки пира</button>
        </div>

        <!-- Блок с описанием -->
        <div id="query-description" class="query-description">Выберите операцию, чтобы увидеть описание.</div>

        <form id="sql-form">
            <label for="sql-query">Введите SQL-запрос:</label><br>
            <textarea id="sql-query" name="sql" placeholder="SELECT * FROM table_name"></textarea><br>
            <button type="submit">Выполнить</button>
            <button type="button" onclick="clearQuery()">Очистить</button>
        </form>
        <div id="result"></div>
        <script type="text/javascript" src="/js/operations.js"></script>
        <script>

        </script>
    </main>
</div>
</body>
</html>
