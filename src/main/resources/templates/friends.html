<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Friends List</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <div th:replace="~{menu :: menu}"></div>
    <div th:replace="~{menu :: submenu}"></div>
    <main>
        <h2>Friends List</h2>

        <div>
            <a th:href="@{/friends/add}" style="margin-bottom: 10px; display: inline-block;">
                <button type="button">Add New Friends</button>
            </a>
            <a th:href="@{/data/export?tableName=friends&fileName=friends.csv}" style="margin-bottom: 10px; display: inline-block;">
                <button type="button">Export Friends to CSV</button>
            </a>
            <form id="uploadForm" th:action="@{/data/import}" method="post" enctype="multipart/form-data" style="display: inline-block;">
                <input type="hidden" name="tableName" value="friends">
                <input type="file" id="fileInput" name="file" style="display: none;" required>
                <button type="button" id="uploadButton">Import CSV</button>
            </form>
        </div>

        <table th:if="${!#lists.isEmpty(friends)}">
            <thead>
            <tr>
                <th>ID</th>
                <th>Peer #1</th>
                <th>Peer #2</th>
                <th>Edit</th>
                <th>Remove</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="friend : ${friends}">
                <td th:text="${friend.id}"></td>
                <td th:text="${friend.peer_1}"></td>
                <td th:text="${friend.peer_2}"></td>
                <td>
                    <a th:href="@{/friends/edit/{id}(id=${friend.id})}">
                        <img class="icon" src="/pics/pen.png">
                    </a>
                </td>
                <td>
                    <a th:href="@{/friends/remove/{id}(id=${friend.id})}" data-confirm="Вы уверены?">
                        <img class="icon" src="/pics/remove.png">
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </main>
</div>
</body>
<script type="text/javascript" src="/js/confirm_form.js"></script>
<script type="text/javascript" src="/js/import_button.js"></script>
</html>
