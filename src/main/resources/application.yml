server:
  port: 8080

shared:
  path: ${SHARED_PATH:/mnt/d/PROJECTS/IdeaProjects/Info21_Java/shared}

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    path: /api/v1/swagger-ui
  api-docs:
    path: /api/v1

spring:
  application:
    name: Info21
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      schema-locations: classpath:schema.sql
      mode: always

  jpa:
    hibernate:
      ddl-auto: none # опираемся на работу хибернейта
    properties:
      hibernate.default_schema: app # Указываем схему по умолчанию
    show-sql: true

  # ликвибейс пока отключен
  liquibase:
    change-log: classpath:migrations/db.changelog-master.yaml
    enabled: true
    default-schema: app
    liquibase-schema: liquibase
  main:
    banner-mode: off

logging:
  level:
    root: info
    com.zaxxer.hikari: off