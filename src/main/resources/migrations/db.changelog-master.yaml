databaseChangeLog:
  - changeSet: # создание таблиц и триггеров
      id: 1
      author: user
      schemaName: app
      changes:
        - sqlFile:
            path: import_data/0_drop_all.sql
            encoding: UTF-8
            splitStatements: false
            endDelimiter: ";"
  - changeSet: # добавление данных
      id: 2
      author: user
      schemaName: app
      changes:
        - sqlFile:
            path: import_data/1_tables.sql
            encoding: UTF-8
            splitStatements: false
            endDelimiter: ";"
  - changeSet: # добавление данных
      id: 3
      author: user
      schemaName: app
      changes:
        - sqlFile:
            path: import_data/2_insert_data.sql
            encoding: UTF-8
            splitStatements: false
            endDelimiter: ";"